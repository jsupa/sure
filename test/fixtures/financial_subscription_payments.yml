# Financial Subscription Payments
netflix_payment_1:
  id: <%= SecureRandom.uuid %>
  financial_subscription: netflix
  transaction_id: <%= transactions(:grocery).id %>
  payment_date: <%= 1.month.ago.to_date %>
  amount: 15.99
  currency: "USD"
  created_at: <%= 1.month.ago %>
  updated_at: <%= 1.month.ago %>

netflix_payment_2:
  id: <%= SecureRandom.uuid %>
  financial_subscription: netflix
  transaction_id: <%= transactions(:paycheck).id %>
  payment_date: <%= 2.weeks.ago.to_date %>
  amount: 15.99
  currency: "USD"
  created_at: <%= 2.weeks.ago %>
  updated_at: <%= 2.weeks.ago %>

