# Financial Subscriptions
netflix:
  id: <%= SecureRandom.uuid %>
  family: dylan_family
  account: dylan_checking
  name: "Netflix"
  amount: 15.99
  currency: "USD"
  recurrence: "monthly"
  next_payment_date: <%= 1.week.from_now.to_date %>
  description: "Video streaming service"
  created_at: <%= 1.month.ago %>
  updated_at: <%= 1.week.ago %>

spotify:
  id: <%= SecureRandom.uuid %>
  family: dylan_family
  account: dylan_checking
  name: "Spotify"
  amount: 9.99
  currency: "USD"
  recurrence: "monthly"
  next_payment_date: <%= 3.days.from_now.to_date %>
  created_at: <%= 2.weeks.ago %>
  updated_at: <%= 1.day.ago %>

overdue_subscription:
  id: <%= SecureRandom.uuid %>
  family: dylan_family
  account: dylan_savings
  name: "Overdue Service"
  amount: 29.99
  currency: "USD"
  recurrence: "monthly"
  next_payment_date: <%= 5.days.ago.to_date %>
  description: "This subscription is overdue"
  created_at: <%= 2.months.ago %>
  updated_at: <%= 5.days.ago %>

annual_subscription:
  id: <%= SecureRandom.uuid %>
  family: dylan_family
  account: dylan_checking
  name: "Annual Software License"
  amount: 120.00
  currency: "USD"
  recurrence: "yearly"
  next_payment_date: <%= 6.months.from_now.to_date %>
  created_at: <%= 6.months.ago %>
  updated_at: <%= 1.month.ago %>